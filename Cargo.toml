[package]
name = "bevytris"
version = "0.4.0"
edition = "2024"

[workspace]
members = [".", "crates/core", "crates/chiptune"]

[dependencies]
bevytris-core = { path = "crates/core" }
bevytris-chiptune = { path = "crates/chiptune" }
bevy = { version = "0.19", features = ["wav"] }
dirs = "6"
sys-locale = "0.3"
rand = "0.9"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

# Faster incremental builds: optimize dependencies (incl. bevy) even in dev,
# keep our own crate lightly optimized for quick rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
